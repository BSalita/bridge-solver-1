[package]
name = "bridge-solver-wasm"
version = "2.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for bridge-solver: double-dummy tables and cardplay analysis in the browser"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine, with the cardplay analysis feature. Path dep: this crate lives in
# the same repo and must always build against the adjacent source, never a
# published or pinned copy.
bridge-solver = { path = "..", features = ["json"] }
bridge-types = { git = "https://github.com/bridge-craftwork/bridge-types" }
# LIN parsing. Deliberately not `bridge-parsers`, which cannot build for wasm32
# (it reaches for `reqwest::blocking`); this crate needs only bridge-types and
# thiserror.
bridge-encodings = { git = "https://github.com/bridge-craftwork/bridge-encodings" }

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
