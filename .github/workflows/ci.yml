name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build library
      run: cargo build --verbose

    - name: Build CLI binaries
      run: cargo build --features cli --verbose

    - name: Run tests
      # Not `--all-features`: that switches on the debug features
      # (no_tricks_pruning, no_fast_tricks, ...) which alter solver results.
      run: cargo test --workspace --features cli,play-analysis,json

    - name: Build release
      run: cargo build --features cli --release --verbose

    # THIRD-PARTY-NOTICES asserts what a distributed copy contains. A
    # hand-kept one goes stale the moment a dependency moves, and a stale
    # notice is worse than none — so both are generated, and this fails if
    # they no longer match what cargo resolved.
    - name: Check the third-party notices are up to date
      if: runner.os == 'Linux'
      run: scripts/third-party-notices.py --check

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy (library)
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Run clippy (cli + play-analysis + json)
      run: cargo clippy --workspace --all-targets --features cli,play-analysis,json -- -D warnings

  # `wasm/` is a separate workspace (it path-depends on this crate), so the jobs
  # above never reach it: `--workspace` here does not include it. Without this
  # job its tests never run and a wasm32 regression — the `Instant` trap class of
  # problem, which compiles fine and only fails at runtime — ships unnoticed.
  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: wasm

    - name: Check formatting
      working-directory: wasm
      run: cargo fmt --all -- --check

    - name: Run clippy
      working-directory: wasm
      run: cargo clippy --all-targets -- -D warnings

    # Native, so the LIN-parsing tests actually execute.
    - name: Run tests
      working-directory: wasm
      run: cargo test

    # The target that matters: everything above can pass while wasm32 fails.
    - name: Build for wasm32
      working-directory: wasm
      run: cargo build --target wasm32-unknown-unknown --release

  # The Pages site. Its own build runs only on main, so this is what catches a
  # broken site on a pull request.
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: wasm

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        # Vite 7 wants 20.19+ or 22.12+; 22 resolves to the latest 22.x.
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    # PINNED, not `latest`. This action resolves `latest` by asking the
    # GitHub API, and when that call fails it does not fail the step — it
    # silently falls back to its own default, wasm-pack v0.9.1, whose
    # wasm-opt is too old to parse what wasm-bindgen emits. The build then
    # dies with "Only 1 table definition allowed in MVP", which names
    # nothing relevant. pdf-handouts hit exactly that on 2026-09-01.
    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@v0.4.0
      with:
        version: 'v0.15.0'

    - name: Install dependencies
      working-directory: web
      run: npm ci

    - name: Build the WebAssembly bundle
      working-directory: web
      run: npm run wasm

    - name: Run tests
      working-directory: web
      run: npm test

    - name: Build the site
      working-directory: web
      run: npm run build

  # The C library: libbridgesolver and include/bridge_solver.h.
  ffi:
    name: C library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ffi

    - name: Check formatting and lint
      working-directory: ffi
      shell: bash
      run: |
        cargo fmt --all -- --check
        cargo clippy --all-targets -- -D warnings

    - name: Run tests
      working-directory: ffi
      run: cargo test

    - name: Build the libraries
      working-directory: ffi
      run: cargo build --release

    # The header is hand-written, so compiling C against it and the built
    # library is what proves the two agree.
    - name: Build and run the C example
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        cc -Wall -Wextra -Werror -o example ffi/examples/example.c \
          -Iffi/include -Lffi/target/release -lbridgesolver
        LD_LIBRARY_PATH=ffi/target/release DYLD_LIBRARY_PATH=ffi/target/release ./example

    # The static library, linked with exactly the flags ffi/README.md gives.
    - name: Link the C example statically
      if: matrix.os == 'ubuntu-latest'
      run: |
        cc -o example-static ffi/examples/example.c -Iffi/include \
          ffi/target/release/libbridgesolver.a -lgcc_s -lutil -lrt -lpthread -lm -ldl -lc
        ./example-static

  # The Python package (python/), built as a wheel and installed the way a
  # user would, then tested. 3.9 is the oldest the abi3 wheel supports.
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: python

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Check formatting and lint
      working-directory: python
      shell: bash
      run: |
        cargo fmt --all -- --check
        cargo clippy --all-targets -- -D warnings

    - name: Build the wheel and install it
      shell: bash
      run: |
        python -m pip install --upgrade pip maturin pytest
        maturin build --release --manifest-path python/Cargo.toml --out dist
        python -m pip install --no-index --find-links dist bridge-solver

    # From outside the source tree, so the tests import the installed wheel
    # rather than the source directory.
    - name: Run the tests and the docstring examples
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        python -m pytest -q "$GITHUB_WORKSPACE/python/tests"
        python -m pytest -q --doctest-modules --pyargs bridge_solver

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, lint, wasm, web, ffi, python]

    steps:
    - name: Summary
      run: |
        echo "All tests passed"
        echo "All platforms (Linux, Windows, macOS) built successfully"
        echo "WebAssembly target built and its tests passed"
        echo "The Pages site built and its tests passed"
        echo "The C library built, and the C example ran against it"
        echo "The Python package built, installed and passed its tests"
        echo "Code formatting and linting passed"
