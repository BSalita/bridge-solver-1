name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Every crate's version must match the tag before anything is built. PyPI
  # never accepts the same version twice, so a mismatch caught after upload
  # could not be corrected, only skipped past.
  check-version:
    name: Check versions match the tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compare
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          for manifest in Cargo.toml wasm/Cargo.toml ffi/Cargo.toml python/Cargo.toml; do
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -1)
            if [ "$version" != "$tag" ]; then
              echo "::error file=$manifest::version $version does not match tag v$tag"
              status=1
            fi
          done
          exit $status

  build-release:
    name: Build Release
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: ""
            asset_suffix: linux-x86_64
            strip: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: ".exe"
            asset_suffix: windows-x86_64
            strip: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_suffix: ""
            asset_suffix: macos-x86_64
            strip: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: ""
            asset_suffix: macos-aarch64
            strip: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binaries
        run: cargo build --release --features cli --target ${{ matrix.target }}

      - name: Strip binaries (Linux only)
        if: matrix.strip
        run: |
          strip target/${{ matrix.target }}/release/bridge-solver
          strip target/${{ matrix.target }}/release/solver-diag
          strip target/${{ matrix.target }}/release/bridge-claim

      - name: Create distribution package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bridge-solver${{ matrix.artifact_suffix }} dist/bridge-solver-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
          cp target/${{ matrix.target }}/release/solver-diag${{ matrix.artifact_suffix }} dist/solver-diag-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
          cp target/${{ matrix.target }}/release/bridge-claim${{ matrix.artifact_suffix }} dist/bridge-claim-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
          # The licences of what bridge-solver links ask that their copyright
          # notices travel with copies. This is the copy.
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES README.md dist/

      - name: Create tarball (Linux and macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd dist
          tar -czf bridge-solver-${{ matrix.asset_suffix }}.tar.gz \
            bridge-solver-${{ matrix.asset_suffix }} \
            solver-diag-${{ matrix.asset_suffix }} \
            bridge-claim-${{ matrix.asset_suffix }} \
            LICENSE-MIT \
            LICENSE-APACHE \
            THIRD-PARTY-NOTICES \
            README.md

      - name: Create zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd dist
          7z a bridge-solver-${{ matrix.asset_suffix }}.zip \
            bridge-solver-${{ matrix.asset_suffix }}.exe \
            solver-diag-${{ matrix.asset_suffix }}.exe \
            bridge-claim-${{ matrix.asset_suffix }}.exe \
            LICENSE-MIT \
            LICENSE-APACHE \
            THIRD-PARTY-NOTICES \
            README.md

      # The C library: header, shared and static libraries, and the example,
      # for programs in other languages. See ffi/README.md.
      - name: Build the C library
        run: cargo build --release --manifest-path ffi/Cargo.toml --target ${{ matrix.target }}

      - name: Package the C library
        shell: bash
        run: |
          pkg=bridge-solver-c-${{ matrix.asset_suffix }}
          out=ffi/target/${{ matrix.target }}/release
          mkdir -p dist/$pkg/include dist/$pkg/lib dist/$pkg/examples
          cp ffi/include/bridge_solver.h dist/$pkg/include/
          cp ffi/examples/example.c dist/$pkg/examples/
          for f in libbridgesolver.so libbridgesolver.dylib libbridgesolver.a \
                   bridgesolver.dll bridgesolver.dll.lib bridgesolver.lib; do
            if [ -f "$out/$f" ]; then cp "$out/$f" dist/$pkg/lib/; fi
          done
          cp ffi/README.md LICENSE-MIT LICENSE-APACHE ffi/THIRD-PARTY-NOTICES dist/$pkg/
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a $pkg.zip $pkg
          else
            tar -czf $pkg.tar.gz $pkg
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bridge-solver-c-${{ matrix.asset_suffix }}.tar.gz
            dist/bridge-solver-c-${{ matrix.asset_suffix }}.zip
            dist/bridge-solver-${{ matrix.asset_suffix }}.tar.gz
            dist/bridge-solver-${{ matrix.asset_suffix }}.zip
            dist/bridge-solver-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
            dist/solver-diag-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
            # Standalone, so the claim benchmark page can link one download per system.
            dist/bridge-claim-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The fifth target. The same engine as the CLIs, compiled to wasm32 and
  # wrapped for JavaScript, so a browser or a Node process can solve without a
  # native binary. This is what the demonstration site runs on; releasing it
  # means someone can build against the exact engine a given tag shipped.
  build-wasm:
    name: Build WebAssembly package
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      # PINNED, not `latest`, for the reason spelled out in pages.yml: this
      # action resolves `latest` through the GitHub API and, when that call
      # fails, does not fail the step but silently falls back to wasm-pack
      # v0.9.1, whose wasm-opt is too old to parse what wasm-bindgen emits.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      # `--target web` loads from a plain <script type="module"> and through
      # any bundler. Unlike the site build this keeps the TypeScript
      # definitions, since the point of the artifact is other people writing
      # against it.
      - name: Build the WebAssembly package
        run: wasm-pack build wasm --release --target web --out-dir pkg

      - name: Create distribution package
        shell: bash
        run: |
          mkdir -p dist
          # wasm-pack writes a `.gitignore` of `*` into the output; it means
          # nothing inside a tarball and only confuses whoever unpacks it.
          rm -f wasm/pkg/.gitignore
          cp LICENSE-MIT LICENSE-APACHE wasm/pkg/
          cp web/public/THIRD-PARTY-NOTICES wasm/pkg/
          tar -czf dist/bridge-solver-wasm.tar.gz -C wasm pkg

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bridge-solver-wasm.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Python package, `pip install bridge-solver`: one abi3 wheel per
  # platform serves every Python from 3.9 on, so nobody needs a compiler.
  build-python:
    name: Python wheel (${{ matrix.name }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64 }
          - { name: macos-x86_64, os: macos-latest, target: x86_64 }
          - { name: macos-aarch64, os: macos-latest, target: aarch64 }
          - { name: windows-x86_64, os: windows-latest, target: x64 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --manifest-path python/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.name }}
          path: dist

  # The source package, for any platform without a wheel: pip builds it,
  # which needs a Rust toolchain on that machine.
  build-python-sdist:
    name: Python source package
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the source package
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist

  # Upload to PyPI by trusted publishing: PyPI trusts this workflow, in this
  # repository, in the `pypi` environment, so no token is stored anywhere.
  # Setting that up on pypi.org is a one-time step; see python/RELEASING.md.
  publish-python:
    name: Publish to PyPI
    needs: [build-python, build-python-sdist, build-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bridge-solver/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          merge-multiple: true
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
