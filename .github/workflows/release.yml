name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: ""
            asset_suffix: linux-x86_64
            strip: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: ".exe"
            asset_suffix: windows-x86_64
            strip: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_suffix: ""
            asset_suffix: macos-x86_64
            strip: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: ""
            asset_suffix: macos-aarch64
            strip: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binaries
        run: cargo build --release --features cli --target ${{ matrix.target }}

      - name: Strip binaries (Linux only)
        if: matrix.strip
        run: |
          strip target/${{ matrix.target }}/release/bridge-solver
          strip target/${{ matrix.target }}/release/solver-diag
          strip target/${{ matrix.target }}/release/bridge-claim

      - name: Create distribution package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bridge-solver${{ matrix.artifact_suffix }} dist/bridge-solver-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
          cp target/${{ matrix.target }}/release/solver-diag${{ matrix.artifact_suffix }} dist/solver-diag-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
          cp target/${{ matrix.target }}/release/bridge-claim${{ matrix.artifact_suffix }} dist/bridge-claim-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
          # The licences of what bridge-solver links ask that their copyright
          # notices travel with copies. This is the copy.
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES README.md dist/

      - name: Create tarball (Linux and macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd dist
          tar -czf bridge-solver-${{ matrix.asset_suffix }}.tar.gz \
            bridge-solver-${{ matrix.asset_suffix }} \
            solver-diag-${{ matrix.asset_suffix }} \
            bridge-claim-${{ matrix.asset_suffix }} \
            LICENSE-MIT \
            LICENSE-APACHE \
            THIRD-PARTY-NOTICES \
            README.md

      - name: Create zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd dist
          7z a bridge-solver-${{ matrix.asset_suffix }}.zip \
            bridge-solver-${{ matrix.asset_suffix }}.exe \
            solver-diag-${{ matrix.asset_suffix }}.exe \
            bridge-claim-${{ matrix.asset_suffix }}.exe \
            LICENSE-MIT \
            LICENSE-APACHE \
            THIRD-PARTY-NOTICES \
            README.md

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bridge-solver-${{ matrix.asset_suffix }}.tar.gz
            dist/bridge-solver-${{ matrix.asset_suffix }}.zip
            dist/bridge-solver-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
            dist/solver-diag-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
            # Standalone, so the claim benchmark page can link one download per system.
            dist/bridge-claim-${{ matrix.asset_suffix }}${{ matrix.artifact_suffix }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The fifth target. The same engine as the CLIs, compiled to wasm32 and
  # wrapped for JavaScript, so a browser or a Node process can solve without a
  # native binary. This is what the demonstration site runs on; releasing it
  # means someone can build against the exact engine a given tag shipped.
  build-wasm:
    name: Build WebAssembly package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      # PINNED, not `latest`, for the reason spelled out in pages.yml: this
      # action resolves `latest` through the GitHub API and, when that call
      # fails, does not fail the step but silently falls back to wasm-pack
      # v0.9.1, whose wasm-opt is too old to parse what wasm-bindgen emits.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      # `--target web` loads from a plain <script type="module"> and through
      # any bundler. Unlike the site build this keeps the TypeScript
      # definitions, since the point of the artifact is other people writing
      # against it.
      - name: Build the WebAssembly package
        run: wasm-pack build wasm --release --target web --out-dir pkg

      - name: Create distribution package
        shell: bash
        run: |
          mkdir -p dist
          # wasm-pack writes a `.gitignore` of `*` into the output; it means
          # nothing inside a tarball and only confuses whoever unpacks it.
          rm -f wasm/pkg/.gitignore
          cp LICENSE-MIT LICENSE-APACHE wasm/pkg/
          cp web/public/THIRD-PARTY-NOTICES wasm/pkg/
          tar -czf dist/bridge-solver-wasm.tar.gz -C wasm pkg

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bridge-solver-wasm.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
