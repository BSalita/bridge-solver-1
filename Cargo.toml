[package]
name = "bridge-solver"
version = "2.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Bridge Double-Dummy Solver - Port of macroxue/bridge-solver"
repository = "https://github.com/bridge-craftwork/bridge-solver"
keywords = ["bridge", "double-dummy", "solver", "cards"]
categories = ["games", "algorithms"]

[features]
default = []
cli = ["clap", "dds-engine"]

# Other double-dummy engines (src/dds_engine.rs): any DDS-compatible shared
# library -- DDS 2.9, the ddss fork -- loaded at run time by path, never linked.
# The CLI and the Python package use it for `--engine dds`; the benchmark uses
# it to compare engines. Native only: WebAssembly cannot load a library.
dds-engine = ["dep:libloading"]

# Double-dummy cardplay analysis (src/analyse_play.rs): per-card costs and
# alternatives. Optional so callers wanting only a DD result do not pull serde
# and sha2. Enabled by the HTTP service and the WebAssembly build.
play-analysis = ["serde", "sha2"]

# The engine as JSON in, JSON out (src/json_api.rs): the one definition of
# requests and responses that the WebAssembly, C and Python bindings share.
json = ["play-analysis", "dep:serde_json"]

# Performance harness (src/bin/solver-bench): per-board cost, thread sweep and
# release-to-release comparison. Optional so the normal build pulls in neither
# serde_json nor libc; run on demand, never in CI.
bench = ["cli", "serde", "dep:serde_json", "dep:libc", "dds-engine"]

# Adds DDS 2.9 as a reference in the harness, linked in-process so both solvers
# are measured by the same code on the same corpus. Needs an arm64 libdds.a;
# see bench/README.md. Never enabled by default, and the build script is inert
# without it.
dds-reference = ["bench"]

# Debug features
debug_mtdf = []
debug_fast = []
debug_search = []
no_tricks_pruning = []
no_fast_tricks = []
no_slow_tricks = []

[[bin]]
name = "solver-diag"
path = "src/bin/solver-diag/main.rs"
required-features = ["cli"]

[[bin]]
name = "bridge-solver"
path = "src/bin/bridge-solver/main.rs"
required-features = ["cli"]

[[bin]]
name = "bridge-claim"
path = "src/bin/bridge-claim/main.rs"
required-features = ["cli"]

[[bin]]
name = "solver-bench"
path = "src/bin/solver-bench/main.rs"
required-features = ["bench"]

# Declared so the featureless `clippy --all-targets` pass skips it rather than
# failing to compile: it uses `analyse_play`, which is gated behind
# `play-analysis`.
[[example]]
name = "bench_fixtures"
path = "examples/bench_fixtures.rs"
required-features = ["play-analysis"]

[[example]]
name = "time_optimal_line"
path = "examples/time_optimal_line.rs"
required-features = ["play-analysis"]

[dependencies]
bridge-types = { git = "https://github.com/bridge-craftwork/bridge-types" }
bridge-encodings = { git = "https://github.com/bridge-craftwork/bridge-encodings" }
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
serde_json = { version = "1", optional = true }
libloading = { version = "0.8", optional = true }

[target.'cfg(unix)'.dependencies]
# Bench-only, for getrusage: CPU time is what separates "we used more cores"
# from "we got faster per core", and std has no API for it.
libc = { version = "0.2", optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
